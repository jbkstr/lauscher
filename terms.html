<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="icon" type="image/png" sizes="64x64" href="icons/favicon-64.png">
  <title>Nutzungsbedingungen – Lauscher</title>
  <meta name="description" content="Nutzungsbedingungen der App Lauscher (Gehörbildung & Musiktheorie).">
  <!-- Öffentliche Fassung der Nutzungsbedingungen (Adresse u. a. für Google Play / App Store).
       Der Text kommt aus legal.js – dieselbe Quelle wie in der App. -->
  <style>
    @font-face {
      font-family: "Andika";
      src: url("fonts/Andika/Andika-Regular.ttf") format("truetype");
      font-weight: 100 549;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: "Andika";
      src: url("fonts/Andika/Andika-Bold.ttf") format("truetype");
      font-weight: 550 1000;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: "Andika";
      src: url("fonts/Andika/Andika-BoldItalic.ttf") format("truetype");
      font-weight: 550 1000;
      font-style: italic;
      font-display: swap;
    }
    :root {
      --bg: #F6F4EE;
      --card: #FFFFFF;
      --ink: #243545;
      --muted: #6B7280;
      --accent: #3F6B52;
      --border: rgba(36, 53, 69, 0.12);
      --draft-bg: #FCE3DA;
      --draft-ink: #A6412A;
      --head-bg: #EEF2EE;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #161B22;
        --card: #1F2630;
        --ink: #E6E9EE;
        --muted: #A3ABB8;
        --accent: #9CC9AC;
        --border: rgba(230, 233, 238, 0.14);
        --draft-bg: #4A2A22;
        --draft-ink: #FFB8A3;
        --head-bg: #263040;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: "Andika", system-ui, sans-serif;
      font-size: 16px;
      line-height: 1.6;
    }
    main {
      max-width: 760px;
      margin: 0 auto;
      padding: 28px 16px 56px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 24px 22px 28px;
    }
    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 18px;
      flex-wrap: wrap;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-style: italic;
      font-size: 1.15rem;
    }
    .brand img {
      width: 40px;
      height: 40px;
      border-radius: 10px;
    }
    .lang-switch a {
      color: var(--accent);
      font-weight: 700;
      text-decoration: none;
      padding: 4px 8px;
      border-radius: 8px;
    }
    .lang-switch a[aria-current="true"] {
      background: var(--head-bg);
      color: var(--ink);
    }
    h1 { margin: 0 0 4px; font-size: 1.7rem; line-height: 1.25; }
    .meta { margin: 0 0 14px; color: var(--muted); font-size: 0.9rem; }
    .draft {
      margin: 0 0 14px;
      padding: 8px 12px;
      border-radius: 10px;
      background: var(--draft-bg);
      color: var(--draft-ink);
      font-weight: 700;
      font-size: 0.92rem;
    }
    .note { margin: 0 0 14px; color: var(--muted); font-size: 0.92rem; }
    .legal-doc h3 { margin: 1.6rem 0 0.4rem; font-size: 1.12rem; }
    .legal-doc p, .legal-doc ul { margin: 0 0 0.75rem; }
    .legal-doc ul { padding-inline-start: 1.3rem; }
    .legal-doc li { margin-bottom: 0.3rem; }
    .legal-doc a { color: var(--accent); font-weight: 700; overflow-wrap: anywhere; }
    .legal-table-wrap { overflow-x: auto; margin: 0 0 0.75rem; }
    .legal-doc table { width: 100%; border-collapse: collapse; font-size: 0.92rem; overflow-wrap: normal; }
    .legal-doc th, .legal-doc td { -webkit-hyphens: auto; hyphens: auto; }
    .legal-doc th, .legal-doc td {
      padding: 7px 9px;
      border: 1px solid var(--border);
      text-align: start;
      vertical-align: top;
    }
    .legal-doc th { background: var(--head-bg); }
    .legal-footer {
      margin-top: 24px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      font-size: 0.9rem;
    }
    .legal-footer a {
      color: var(--accent);
      font-weight: 700;
      text-decoration: none;
    }
    .legal-footer a:hover { text-decoration: underline; }
    noscript p { color: var(--draft-ink); font-weight: 700; }
  </style>
</head>
<body>
  <main>
    <div class="card">
      <div class="top">
        <div class="brand"><img src="icons/app-icon.jpg" alt="" width="40" height="40"><span>Lauscher</span></div>
        <nav class="lang-switch" aria-label="Sprache / Language">
          <a href="?lang=de" data-lang="de">Deutsch</a>
          <a href="?lang=en" data-lang="en">English</a>
        </nav>
      </div>
      <h1 id="legalTitle">Nutzungsbedingungen</h1>
      <p id="legalMeta" class="meta"></p>
      <p id="legalDraft" class="draft" hidden></p>
      <p id="legalLangNotice" class="note" hidden></p>
      <div id="legalContent" class="legal-doc">
        <noscript><p>Bitte JavaScript aktivieren, um die Nutzungsbedingungen anzuzeigen. / Please enable JavaScript to view the terms of use.</p></noscript>
      </div>
      <nav class="legal-footer" aria-label="Weitere Seiten">
        <a id="legalAppLink" href="./">← Zur App</a>
        <a id="legalSiblingLink" href="privacy.html">Datenschutzerklärung</a>
        <a id="legalLicensesLink" href="licenses.html">Lizenzen</a>
      </nav>
    </div>
  </main>

  <script src="legal.js"></script>
  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var requested = params.get("lang");
      var browserLang = (navigator.language || "de").slice(0, 2).toLowerCase();
      var lang = requested === "en" || requested === "de" ? requested : (browserLang === "de" ? "de" : "en");
      var doc = getLegalDocument("terms", lang);
      if (!doc) return;
      document.documentElement.lang = doc.lang;
      document.title = doc.title + " – Lauscher";
      document.getElementById("legalTitle").textContent = doc.title;
      document.getElementById("legalMeta").textContent = doc.updated;
      var draft = document.getElementById("legalDraft");
      draft.textContent = doc.draftNotice || "";
      draft.hidden = !doc.isDraft;
      var langNotice = document.getElementById("legalLangNotice");
      langNotice.textContent = doc.langNotice || "";
      langNotice.hidden = !doc.langNotice;
      document.getElementById("legalContent").innerHTML = doc.html;
      document.querySelectorAll(".lang-switch a").forEach(function (a) {
        a.setAttribute("aria-current", String(a.dataset.lang === doc.lang));
      });
      var appLink = document.getElementById("legalAppLink");
      var siblingLink = document.getElementById("legalSiblingLink");
      var licensesLink = document.getElementById("legalLicensesLink");
      if (doc.lang === "en") {
        if (appLink) appLink.textContent = "← Back to app";
        if (siblingLink) {
          siblingLink.textContent = "Privacy Policy";
          siblingLink.href = "privacy.html?lang=en";
        }
        if (licensesLink) {
          licensesLink.textContent = "Licenses";
          licensesLink.href = "licenses.html?lang=en";
        }
      }
    })();
  </script>
</body>
</html>
