# Lauscher • Web-App auf GitHub Pages veröffentlichen.
# Die Audio-Samples liegen im privaten Repo jbkstr/lauscher-samples und werden nur hier beim Bauen
# der Website eingesetzt (Zugriff per Deploy-Key im Secret SAMPLES_DEPLOY_KEY, nur Lesezugriff).
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Quellcode holen
        uses: actions/checkout@v7

      - name: Samples aus privatem Repo holen
        uses: actions/checkout@v7
        with:
          repository: jbkstr/lauscher-samples
          ssh-key: ${{ secrets.SAMPLES_DEPLOY_KEY }}
          path: _samples

      - name: Website zusammenstellen
        run: |
          set -euo pipefail
          # Die App lädt nur die Bundles; die .m4a-Rohdateien werden nicht veröffentlicht
          for i in bass brass guitar percussion piano strings voice; do
            cp _samples/$i-bundle.js samples/
          done
          python3 scripts/build-sw.py
          # Projekt-Check (Syntax, undefinierte Namen, tote DOM-IDs, i18n, PWA, Logik-Tests)
          # – schlägt er fehl, geht nichts live. Das Mobile-Bundle wird hier nicht gebaut.
          python3 scripts/check-project.py --no-bundle
          mkdir -p _site
          rsync -a ./ _site/ \
            --exclude '.git' --exclude '.github' --exclude '_samples' --exclude '_site' \
            --exclude 'daw-sampling' --exclude '.claude'
          # Pflichtdateien prüfen, damit nie eine Website ohne Samples oder PWA live geht
          for f in index.html manifest.webmanifest sw.js samples/piano-bundle.js samples/guitar-bundle.js; do
            test -s "_site/$f" || { echo "Fehlt: $f"; exit 1; }
          done

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
